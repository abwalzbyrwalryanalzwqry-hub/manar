apply plugin: 'com.android.application'

/**
 * Manar — release-ready Android application module.
 *
 * Signing credentials never live in this file or in the repository. They are
 * read from `android/keystore.properties` (git-ignored) or, in CI, from the
 * MANAR_KEYSTORE / MANAR_STORE_PASSWORD / MANAR_KEY_ALIAS / MANAR_KEY_PASSWORD
 * environment variables. When neither is present the release build falls back to
 * the debug signing config so `assembleRelease` still succeeds locally — unless
 * MANAR_REQUIRE_RELEASE_SIGNING=true, in which case the build fails instead.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * رقم الإصدار الديناميكي.
 *
 * كان `versionCode 1` مكتوباً يدوياً في كل الفروع؛ وGoogle Play يرفض أي
 * حزمة رقمها ليس أعلى ممّا سبق، فكان كل تحديث يلزمه تعديل يدوي منسيً.
 * مصدر واحد للرقم في كل بيئة: **عدد الالتزامات حتى HEAD**. البناء المحلي وبناء
 * GitHub Actions يعطيان الرقم نفسه للالتزام نفسه، ويزيد مع كل دمج في main.
 *
 * لماذا حُذف GITHUB_RUN_NUMBER (المرحلة ٣١): رقم التشغيل خاصٌّ بكل ملف سير عمل
 * ويبدأ من ١، بينما عدد الالتزامات كان ٤٦٨ حين كان رقم التشغيل ١٢٥. فحزمة
 * مبنية محلياً (٤٦٨) ثم حزمة من CI (١٢٦) = رقم يتراجع، ويرفضها Google Play.
 *
 * الأولوية:
 *   ١) MANAR_VERSION_CODE — تجاوز صريح (رقم صحيح موجب) عند الحاجة.
 *   ٢) عدد الالتزامات — يتطلّب تاريخاً كاملاً؛ في CI: `fetch-depth: 0`.
 *   ٣) 1 — ملاذ للتجربة فقط (شجرة بلا Git أو نسخة سطحية)، مع تحذير.
 *      في بناء الإصدار (MANAR_REQUIRE_RELEASE_SIGNING=true) يتوقف البناء بدل
 *      أن يُخرج حزمة برقم خاطئ.
 *
 * و`versionName` يُقرأ من package.json ليبقى مصدر واحد للرقم بين الويب والتطبيق.
 */
// ProcessBuilder وليس Project.exec: الأخير مهجور في Gradle الحديث ويكسر ذاكرة
// التهيئة (configuration cache).
def runGit = { List<String> args ->
    try {
        def proc = new ProcessBuilder(['git'] + args)
            .directory(rootProject.projectDir.parentFile)
            .redirectErrorStream(true)
            .start()
        def out = proc.inputStream.text.trim()
        proc.waitFor()
        return proc.exitValue() == 0 ? out : null
    } catch (Exception ignored) {
        return null
    }
}

def resolvedVersionCode = {
    def strict = (System.getenv("MANAR_REQUIRE_RELEASE_SIGNING") ?: "").toBoolean()
    def explicit = System.getenv("MANAR_VERSION_CODE")?.trim()
    if (explicit) {
        if (explicit.isInteger() && explicit.toInteger() > 0) return explicit.toInteger()
        throw new GradleException("Manar: MANAR_VERSION_CODE يجب أن يكون رقماً صحيحاً موجباً، والقيمة '${explicit}'.")
    }
    // نسخة سطحية (checkout افتراضي بعمق ١) تعطي عدداً خاطئاً صغيراً.
    def shallow = runGit(['rev-parse', '--is-shallow-repository']) == 'true'
    def count = runGit(['rev-list', '--count', 'HEAD'])
    if (!shallow && count?.isInteger() && count.toInteger() > 0) return count.toInteger()
    def why = shallow ? "النسخة سطحية (استعمل fetch-depth: 0 أو git fetch --unshallow)" : "لا تاريخ Git"
    if (strict) {
        throw new GradleException("Manar: تعذّر حساب versionCode — ${why}. عيّن MANAR_VERSION_CODE أو اجلب التاريخ كاملاً.")
    }
    logger.warn("Manar: versionCode=1 لأن ${why}. هذه الحزمة للتجربة فقط.")
    return 1
}()

def resolvedVersionName = {
    try {
        def pkg = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json"))
        return (pkg.version ?: "1.0.0").toString()
    } catch (Exception ignored) {
        return "1.0.0"
    }
}()

logger.lifecycle("Manar: versionCode=${resolvedVersionCode} versionName=${resolvedVersionName}")

def resolvedStoreFile = keystoreProperties['storeFile'] ?: System.getenv("MANAR_KEYSTORE")
def resolvedStorePassword = keystoreProperties['storePassword'] ?: System.getenv("MANAR_STORE_PASSWORD")
def resolvedKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv("MANAR_KEY_ALIAS")
def resolvedKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv("MANAR_KEY_PASSWORD")
def hasReleaseSigning = resolvedStoreFile != null && rootProject.file(resolvedStoreFile).exists()

/*
 * حماية التوقيع: بلا مفتاح يُوقَّع «الإصدار» بمفتاح التصحيح — مقبول للتجربة المحلية
 * واختبار المحاكي، لكنه حزمة لا يقبلها Google Play ولا تُثبَّت فوق النسخة المنشورة.
 * - MANAR_REQUIRE_RELEASE_SIGNING=true (خطوة الإصدار في CI): غياب المفتاح أو كلمة
 *   مروره خطأ يوقف البناء بدل أن يُخرج حزمة موقّعة بمفتاح التصحيح بصمت.
 * - في غير ذلك: تحذير واضح في سجلّ البناء.
 */
def requireReleaseSigning = (System.getenv("MANAR_REQUIRE_RELEASE_SIGNING") ?: "").toBoolean()
if (requireReleaseSigning) {
    if (!hasReleaseSigning) {
        throw new GradleException("Manar: MANAR_REQUIRE_RELEASE_SIGNING=true لكن ملف مفتاح التوقيع غير موجود (${resolvedStoreFile ?: 'غير محدَّد'}).")
    }
    if (!resolvedStorePassword || !resolvedKeyAlias || !resolvedKeyPassword) {
        throw new GradleException("Manar: MANAR_REQUIRE_RELEASE_SIGNING=true لكن كلمة مرور المفتاح أو اسمه غير محدَّد.")
    }
} else if (!hasReleaseSigning) {
    logger.warn("Manar: لا مفتاح توقيع — حزمة release ستوقَّع بمفتاح التصحيح (غير صالحة للرفع إلى Google Play).")
}

android {
    namespace "app.manar.islamic"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.manar.islamic"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Arabic is the primary language; English is the secondary one.
        resourceConfigurations += ["ar", "en"]

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(resolvedStoreFile)
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty "widgetLab", System.getenv("WIDGET_LAB_DIR") ?: ""
            systemProperty "robolectric.graphicsMode", "NATIVE"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    // The bundled Adhan recordings are already compressed MP3 — let the build
    // know so it does not try to re-compress them into the APK.
    androidResources {
        // وتسجيلات الإقامة (Ogg Opus وM4A) كذلك: تُقرأ من الحزمة كما هي.
        // ملفات JSON (نص القرآن والتفسيران والأذكار والأحاديث) نصّ خام يُضغط
        // إلى نحو الربع، فتُترك للضغط: الـ WebView يقرؤها عبر AssetManager.open
        // الذي يفكّ الضغط تلقائياً، ولا شيء يفتحها بـ openFd.
        noCompress += ['mp3', 'ogg', 'm4a', 'woff2']
    }

    bundle {
        language {
            // Keep both languages in every delivered split: the user can switch
            // the app language without a Play re-download.
            enableSplit = false
        }
    }

    /* المرحلة ٣١: كان الفحص مطفأً كلياً. الآن:
     * - بناء الإصدار يشغّل lintVitalRelease ويتوقف على الأخطاء «القاتلة» وحدها
     *   (تعطّل مؤكد عند التشغيل: مورد مفقود، إذن ناقص، واجهة غير موجودة…).
     * - التقرير الكامل (`./gradlew lintDebug`) يُرفع أثراً في CI للمراجعة، ولا
     *   يوقف البناء بعد؛ يُشدَّد بعد مراجعة أول تقرير. */
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        htmlReport true
        xmlReport true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MediaSessionCompat + MediaStyle notification for the Adhan lock-screen controls.
    implementation "androidx.media:media:$androidxMediaVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // اختبارات الويدجت على JVM: Robolectric يرسم RemoteViews فعلياً (رسم أصلي).
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
