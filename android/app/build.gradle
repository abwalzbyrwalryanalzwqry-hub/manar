apply plugin: 'com.android.application'

/**
 * Manar — release-ready Android application module.
 *
 * Signing credentials never live in this file or in the repository. They are
 * read from `android/keystore.properties` (git-ignored) or, in CI, from the
 * MANAR_KEYSTORE / MANAR_STORE_PASSWORD / MANAR_KEY_ALIAS / MANAR_KEY_PASSWORD
 * environment variables. When neither is present the release build falls back to
 * the debug signing config so `assembleRelease` still succeeds locally.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * رقم الإصدار الديناميكي.
 *
 * كان `versionCode 1` مكتوباً يدوياً في كل الفروع؛ وGoogle Play يرفض أي
 * حزمة رقمها ليس أعلى ممّا سبق، فكان كل تحديث يلزمه تعديل يدوي منسيً.
 * الأولوية هنا:
 *   ١) MANAR_VERSION_CODE  — تجاوز صريح عند الحاجة.
 *   ٢) GITHUB_RUN_NUMBER   — داخل GitHub Actions: يزيد مع كل بناء ولا يرجع.
 *   ٣) عدد الالتزامات على الفرع — متزايد طبعاً مع تاريخ المستودع.
 *   ٤) 1 — ملاذ أخير (شجرة بلا Git، كما في بعض أرشيفات المصدر).
 *
 * و`versionName` يُقرأ من package.json ليبقى مصدر واحد للرقم بين الويب والتطبيق.
 */
// ProcessBuilder وليس Project.exec: الأخير مهجور في Gradle الحديث ويكسر ذاكرة
// التهيئة (configuration cache).
def gitCommitCount = {
    try {
        def proc = new ProcessBuilder('git', 'rev-list', '--count', 'HEAD')
            .directory(rootProject.projectDir.parentFile)
            .redirectErrorStream(true)
            .start()
        def out = proc.inputStream.text.trim()
        proc.waitFor()
        return proc.exitValue() == 0 && out.isInteger() ? out.toInteger() : 0
    } catch (Exception ignored) {
        return 0
    }
}

def resolvedVersionCode = {
    def explicit = System.getenv("MANAR_VERSION_CODE")
    if (explicit?.isInteger()) return explicit.toInteger()
    def run = System.getenv("GITHUB_RUN_NUMBER")
    if (run?.isInteger()) return run.toInteger()
    def commits = gitCommitCount()
    return commits > 0 ? commits : 1
}()

def resolvedVersionName = {
    try {
        def pkg = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json"))
        return (pkg.version ?: "1.0.0").toString()
    } catch (Exception ignored) {
        return "1.0.0"
    }
}()

logger.lifecycle("Manar: versionCode=${resolvedVersionCode} versionName=${resolvedVersionName}")

def resolvedStoreFile = keystoreProperties['storeFile'] ?: System.getenv("MANAR_KEYSTORE")
def resolvedStorePassword = keystoreProperties['storePassword'] ?: System.getenv("MANAR_STORE_PASSWORD")
def resolvedKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv("MANAR_KEY_ALIAS")
def resolvedKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv("MANAR_KEY_PASSWORD")
def hasReleaseSigning = resolvedStoreFile != null && rootProject.file(resolvedStoreFile).exists()

android {
    namespace "app.manar.islamic"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.manar.islamic"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Arabic is the primary language; English is the secondary one.
        resourceConfigurations += ["ar", "en"]

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(resolvedStoreFile)
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    // The bundled Adhan recordings are already compressed MP3 — let the build
    // know so it does not try to re-compress them into the APK.
    androidResources {
        // وتسجيلات الإقامة (Ogg Opus وM4A) كذلك: تُقرأ من الحزمة كما هي.
        noCompress += ['mp3', 'ogg', 'm4a', 'woff2', 'json']
    }

    bundle {
        language {
            // Keep both languages in every delivered split: the user can switch
            // the app language without a Play re-download.
            enableSplit = false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MediaSessionCompat + MediaStyle notification for the Adhan lock-screen controls.
    implementation "androidx.media:media:$androidxMediaVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
