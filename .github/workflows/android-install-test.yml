name: اختبار التثبيت على محاكي

# الفحص الساكن يُثبت أن الحزمة موقَّعة وسليمة، ولا يُثبت أنها تُثبَّت وتُقلع.
# هذا الملف يُنصّب الحزمة على محاكي أندرويد حقيقي، يُقلع التطبيق، ويجمع
# لقطات الشاشة وسجل النظام — فإن وقع انهيار عند الإقلاع ظهر هنا لا على هاتف
# المستخدم.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: رقم تشغيل بناء أندرويد الذي نأخذ منه الحزمة
        required: true
      api_level:
        description: إصدار أندرويد للمحاكي
        default: "34"
  push:
    branches: [test/install-emulator]

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: تثبيت وإقلاع على محاكي
    # نظام مثبّت لا ubuntu-latest: انتقال latest إلى Ubuntu 26 (١٩ أكتوبر ٢٠٢٦) قد يكسر
    # KVM والمحاكي؛ نرقّي يدوياً بعد التحقق.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # تنزيل أثر من تشغيلة أخرى يحتاج قراءة Actions.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: تنزيل حزمة الإصدار
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id || '35670771501' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pkg
          merge-multiple: true

      - name: تحديد ملف APK
        id: apk
        run: |
          APK=$(find pkg -name "*release*.apk" | head -1)
          test -n "$APK" || { echo "لا حزمة إصدار في الأثر"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      # المحاكي يحتاج تسريع KVM، وهو متاح على عدّاءات أوبنتو العامة بعد فتح صلاحياته.
      - name: تمكين KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت وإقلاع وجمع الأدلة
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            mkdir -p evidence
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb install -r "${{ steps.apk.outputs.path }}" 2>&1 | tee evidence/install.txt
            adb shell pm list packages | grep app.manar.islamic | tee evidence/package.txt
            adb shell dumpsys package app.manar.islamic > evidence/dumpsys-package.txt
            adb shell pm grant app.manar.islamic android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -n app.manar.islamic/app.manar.islamic.MainActivity
            sleep 45
            adb shell "dumpsys activity activities | grep -i resumed" > evidence/resumed.txt || true
            adb logcat -d > evidence/logcat.txt
            grep -E "FATAL EXCEPTION|ANR in |E AndroidRuntime" evidence/logcat.txt > evidence/crashes.txt || echo "لا انهيارات" > evidence/crashes.txt
            adb exec-out screencap -p > evidence/app-launched.png
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml evidence/ui-app.xml || true
            adb exec-out screencap -p > evidence/step-after-allow.png
            adb shell input tap 539 2165
            sleep 10
            adb exec-out screencap -p > evidence/step-2.png
            adb shell input tap 539 2165
            sleep 10
            adb exec-out screencap -p > evidence/step-3.png
            adb shell input tap 539 2165
            sleep 10
            adb exec-out screencap -p > evidence/step-4.png
            adb shell input tap 539 2165
            sleep 10
            adb exec-out screencap -p > evidence/step-5.png
            adb shell uiautomator dump /sdcard/ui2.xml || true
            adb pull /sdcard/ui2.xml evidence/ui-after-onboarding.xml || true
            adb shell cmd notification allow_dnd app.manar.islamic true || true
            adb shell dumpsys notification --noredact > evidence/notification-dump.txt || true
            adb shell am start -n app.manar.islamic/app.manar.islamic.MainActivity
            sleep 12
            adb exec-out screencap -p > evidence/app-after-dnd.png
            adb shell input keyevent KEYCODE_HOME
            sleep 4
            adb shell input swipe 540 1600 540 400 300
            sleep 6
            adb exec-out screencap -p > evidence/launcher-drawer.png
            adb shell dumpsys package app.manar.islamic > evidence/dumpsys-package-after.txt

      - name: رفع الأدلة
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-test-evidence
          path: evidence
          if-no-files-found: warn
